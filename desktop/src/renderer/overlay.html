<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Companion Overlay</title>
  <link rel="stylesheet" href="./overlay.css" />
</head>
<body>
  <div class="overlay-root" id="overlay-root">

    <!-- Floating AI orb -->
    <div class="orb-wrap">
      <button id="assistant-orb" class="assistant-orb state-idle" type="button" title="AI Companion">
        <!-- SVG ring for mouse-hold 3s progress -->
        <svg class="orb-ring" id="orb-ring" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="30" stroke="#ff5533" stroke-width="3"
                  stroke-linecap="round" transform="rotate(-90 32 32)"
                  stroke-dasharray="188" stroke-dashoffset="188" id="ring-path"/>
        </svg>
        <span class="orb-icon" id="orb-icon">✦</span>
      </button>

      <!-- Small capture preview shown below the orb when screen capture is active -->
      <video id="capture-preview" class="capture-preview hidden" autoplay playsinline muted></video>

      <!-- Meeting window picker popup -->
      <div id="meeting-menu" class="meeting-menu hidden">
        <div class="menu-header">Select meeting window</div>
      </div>

      <!-- Audio mix strip (compact). Collapsible vertical volume strip. -->
      <div id="mix-strip" class="mix-strip" title="AI volume">
        <button id="mix-icon-btn" class="mix-icon-btn" type="button" aria-label="Toggle AI volume controls">🔊</button>
        <div id="mix-controls-wrap" class="mix-controls-wrap">
          <input type="range" id="mix-volume" class="mix-slider" min="0" max="200" step="5" value="100" aria-label="AI volume" orient="vertical" />
          <span id="mix-volume-label" class="mix-value">100%</span>
          <button id="mix-duck" type="button" class="mix-duck on" title="Auto-duck AI when counterparty speaks">DUCK</button>
        </div>
      </div>

      <!-- Multilanguage chip + popup (reversible — hidden if backend reports MULTILANG_ENABLED=false). -->
      <button id="lang-chip" class="lang-chip" type="button" title="Language settings">
        <span id="lang-chip-label">EN</span>
      </button>
      <div id="lang-menu" class="lang-menu hidden" role="dialog" aria-label="Language settings">
        <div class="menu-header">Language</div>
        <p class="lang-help">Controls what the listener transcribes for both speakers and what the AI replies in.</p>
        <label class="lang-row">
          <span class="lang-label">Transcribe</span>
          <select id="lang-spoken" class="lang-select">
            <option value="auto_multi">Auto code-switch (10 langs)</option>
            <option value="pinned:en-US">English (en-US)</option>
            <option value="pinned:hi-IN">Hindi (hi-IN)</option>
            <option value="pinned:gu-IN">Gujarati (gu-IN)</option>
            <option value="pinned:es-US">Spanish (es-US)</option>
            <option value="pinned:fr-FR">French (fr-FR)</option>
            <option value="pinned:de-DE">German (de-DE)</option>
            <option value="pinned:ja-JP">Japanese (ja-JP)</option>
            <option value="pinned:zh-CN">Chinese (zh-CN)</option>
            <option value="pinned:ar">Arabic (ar)</option>
          </select>
        </label>
        <label class="lang-row">
          <span class="lang-label">AI reply</span>
          <select id="lang-reply" class="lang-select">
            <option value="">Same as transcribe</option>
            <option value="en-US">English</option>
            <option value="hi-IN">Hindi</option>
            <option value="gu-IN">Gujarati</option>
            <option value="es-US">Spanish</option>
            <option value="fr-FR">French</option>
            <option value="de-DE">German</option>
            <option value="ja-JP">Japanese</option>
            <option value="zh-CN">Chinese</option>
          </select>
        </label>
        <label class="lang-row">
          <span class="lang-label">Show as</span>
          <select id="lang-display" class="lang-select">
            <option value="">Same as transcribe</option>
            <option value="en-US">English</option>
            <option value="hi-IN">Hindi</option>
            <option value="gu-IN">Gujarati</option>
          </select>
        </label>
        <div class="lang-row lang-actions">
          <span id="lang-status" class="lang-status"></span>
          <button id="lang-apply" type="button">Apply</button>
        </div>
      </div>

    </div>

    <!-- Private AI conversation panel -->
    <div class="caption-panel" id="caption-panel">
      <!-- AI Listening badge -->
      <div class="listen-badge">
        <div class="listen-dots">
          <div class="listen-dot"></div>
          <div class="listen-dot"></div>
          <div class="listen-dot"></div>
        </div>
        <span class="listen-label">AI Listening</span>
      </div>

      <!-- Chat bubbles: only private AI asks + AI replies -->
      <div class="chat-feed" id="chat-feed"></div>
    </div>

  </div>

  <!-- Hidden video for meeting window capture -->
  <video id="meeting-video" class="capture-video" autoplay playsinline muted></video>

  <!-- Screen source picker modal -->
  <div id="screen-picker-overlay" class="screen-picker-overlay hidden">
    <div class="screen-picker-modal">
      <div class="screen-picker-header">
        <span class="screen-picker-title">Select screen or window to capture</span>
        <button id="screen-picker-close" class="screen-picker-close" title="Cancel">✕</button>
      </div>
      <div class="screen-picker-tabs">
        <button class="picker-tab active" data-tab="screen">Screens</button>
        <button class="picker-tab" data-tab="window">Windows</button>
      </div>
      <div id="screen-picker-grid" class="screen-picker-grid"></div>
      <div class="screen-picker-footer">
        <span class="screen-picker-hint">Tip: Capture a full screen for best stability. Window capture may flicker when the app redraws.</span>
      </div>
    </div>
  </div>

  <script src="./overlay.js"></script>
</body>
</html>
