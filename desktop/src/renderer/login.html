<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Sign in — Balaastra Companion</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0f1117;
    color: #e8e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    user-select: none;
    -webkit-app-region: drag; /* draggable titlebar */
  }

  .card {
    -webkit-app-region: no-drag;
    width: 340px;
    background: #181c28;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    padding: 36px 32px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  .logo-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .logo-orb {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.02em;
    text-align: center;
  }

  .subtitle {
    font-size: 0.8rem;
    color: #6b7280;
    text-align: center;
  }

  .btn {
    -webkit-app-region: no-drag;
    width: 100%;
    padding: 11px 16px;
    border-radius: 10px;
    border: none;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .btn-primary {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) { opacity: 0.88; }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #374151;
    font-size: 0.78rem;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.06);
  }

  #status {
    font-size: 0.8rem;
    text-align: center;
    min-height: 1.2em;
    color: #9ca3af;
    transition: color 0.2s;
  }
  #status.err  { color: #f87171; }
  #status.ok   { color: #34d399; }
  #status.info { color: #60a5fa; }

  .footer {
    font-size: 0.72rem;
    color: #374151;
    text-align: center;
    line-height: 1.5;
  }
  .footer a { color: #6366f1; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <div class="logo-orb">🤝</div>
    <h1>Balaastra AI Companion</h1>
    <p class="subtitle">Sign in to start your session</p>
  </div>

  <button id="btn-signin" class="btn btn-primary">
    <span>Sign in / Create account</span>
  </button>

  <p id="status"></p>

  <!-- Shown after clicking Sign in — lets user copy the URL for another browser -->
  <div id="link-row" style="display:none;width:100%;flex-direction:column;gap:8px">
    <p style="font-size:0.75rem;color:#6b7280;text-align:center">
      Browser didn't open? Copy and paste this link:
    </p>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="login-url" readonly
        style="flex:1;background:#0f1117;border:1px solid rgba(255,255,255,0.1);
               border-radius:8px;padding:7px 10px;font-size:0.75rem;color:#9ca3af;
               font-family:monospace;outline:none;-webkit-app-region:no-drag"
        value="" />
      <button id="btn-copy"
        style="-webkit-app-region:no-drag;background:#1e2030;border:1px solid rgba(255,255,255,0.1);
               color:#e8e8f0;border-radius:8px;padding:7px 12px;font-size:0.75rem;
               cursor:pointer;white-space:nowrap;transition:opacity 0.15s"
        onclick="copyLoginUrl()">Copy</button>
    </div>
  </div>

  <p class="footer">
    Your browser will open Clerk's secure sign-in page.<br>
    Email verification and Google login are supported.
  </p>
</div>
<script src="login.js"></script>
</body>
</html>
